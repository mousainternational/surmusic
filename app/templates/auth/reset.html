{% extends "auth/_layout.html" %}
{% block auth %}
<h1 class="h2">Choose a new password</h1>
<form method="post" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  {% if error %}<p class="flash flash-error" role="alert">{{ error }}</p>{% endif %}
  <label for="password">New password <span class="muted">(at least 10 characters)</span></label>
  <input id="password" name="password" type="password" required minlength="10" autocomplete="new-password" autofocus>
  <label for="password2">Repeat new password</label>
  <input id="password2" name="password2" type="password" required minlength="10" autocomplete="new-password">
  <button class="btn btn-primary btn-block">Save new password</button>
</form>
{% endblock %}
