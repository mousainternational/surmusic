{% extends "base.html" %}
{% block content %}
<div class="wrap page narrow center error-page">
  <p class="error-code" aria-hidden="true">404</p>
  <h1>Page not found</h1>
  <p class="muted">The page you are looking for does not exist or has moved.</p>
  <form class="hero-search" action="{{ url_for('public.search') }}" method="get" role="search">
    <label for="nf-q" class="sr">Search radio stations</label>
    <input id="nf-q" name="q" type="search" placeholder="Search radio stations…" maxlength="80">
    <button class="btn btn-primary">Search</button>
  </form>
  <p><a href="{{ url_for('public.home') }}">← Back to home</a></p>
</div>
{% endblock %}
