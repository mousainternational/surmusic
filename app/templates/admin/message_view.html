{% extends "admin/_layout.html" %}
{% block title %}{{ msgrow.subject }}{% endblock %}
{% block admin %}
<div class="card">
  <p><strong>{{ msgrow.name }}</strong> · <a href="mailto:{{ msgrow.email }}?subject={{ ('Re: ' ~ msgrow.subject) | urlencode }}">{{ msgrow.email }}</a><br>
  <span class="small muted">Received {{ msgrow.created_at }} · email delivery: {{ msgrow.email_status }}</span></p>
  <p class="review-body">{{ msgrow.body }}</p>
  <div class="actions">
    <a class="btn btn-primary btn-sm" href="mailto:{{ msgrow.email }}?subject={{ ('Re: ' ~ msgrow.subject) | urlencode }}">Reply by email</a>
    <form method="post" action="{{ url_for('admin.message_delete', mid=msgrow.id) }}" class="inline" data-confirm="Delete this message?">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button class="btn btn-sm btn-ghost">Delete</button>
    </form>
    <a class="btn btn-sm btn-ghost" href="{{ url_for('admin.messages') }}">← All messages</a>
  </div>
</div>
{% endblock %}
