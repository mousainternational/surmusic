# Keeps the free Render server awake (it sleeps after 15 minutes without visitors, and every wake-up is a restart
# that empties its memory and disk). GitHub runs this for free on a public repository; no extra account needed.
name: keep-awake
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may run scheduled jobs a few minutes late; that is fine
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Straight to the Render server: Cloudflare answers 403 to GitHub's data-centre addresses.
      # /ping is not redirected to the own domain, so this reaches the same server.
      - name: Ping the site
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 20 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://surmusic-vv37.onrender.com/ping
