name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping public site
        run: |
          curl --fail --silent --show-error --max-time 20 \
            -A "SurMusic-Uptime/1.0" \
            "https://www.surmusicradio.com/ping" > /dev/null
